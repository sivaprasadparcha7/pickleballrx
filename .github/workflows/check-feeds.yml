name: Check video feeds

# Tests that the YouTube and Instagram fetch works, without publishing anything.
on:
  workflow_dispatch:
  pull_request:
    paths: ["data/fetch_feeds.py", ".github/workflows/check-feeds.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 data/fetch_feeds.py --strict
      - run: python3 -c "import json; [print(v['published'], 'short' if v['short'] else 'video', v['title']) for v in json.load(open('data/youtube.json'))['videos']]"
